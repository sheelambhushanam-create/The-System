<body>
<header id="hud"></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast" aria-live="polite"></div>
<div id="m"></div>
<button id="cb" aria-label="Ask AI Coach" onclick="coach()">🤖</button>

<script>
/* ============================================================================
   1. CORE STATE, INDEXEDDB MEDIA VAULT & INLINE PWA MANIFEST
============================================================================ */
const K = 'thesystem_v9';
const VER = '9.0';
const $ = s => document.querySelector(s);
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = t => { const m = Math.max(1, Math.round((Date.now() - t) / 6e4)); return m < 60 ? m + 'm ago' : Math.round(m / 60) + 'h ago'; };

(function initPWA() {
  try {
    const manifest = {
      name: 'THE SYSTEM v8 — Solo Leveling Fitness & Wellness RPG',
      short_name: 'THE SYSTEM',
      start_url: '.',
      display: 'standalone',
      background_color: '#05080f',
      theme_color: '#00e5ff',
      icons: [{
        src: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#05080f"/><polygon points="64,14 114,64 64,114 14,64" fill="none" stroke="#00e5ff" stroke-width="8"/><text x="64" y="76" font-family="sans-serif" font-weight="900" font-size="44" fill="#00e5ff" text-anchor="middle">S</text></svg>'),
        sizes: '128x128',
        type: 'image/svg+xml'
      }]
    };
    $('#pwa-manifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  } catch (e) {}
})();

const IDB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const req = indexedDB.open('TheSystemMediaDB_v8', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('media');
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  return {
    async put(key, val) {
      try {
        const db = await open();
        return new Promise((res, rej) => {
          const tx = db.transaction('media', 'readwrite');
          tx.objectStore('media').put(val, key);
          tx.oncomplete = () => res(true);
          tx.onerror = () => rej(tx.error);
        });
      } catch (e) { return false; }
    },
    async del(key) {
      try {
        const db = await open();
        const tx = db.transaction('media', 'readwrite');
        tx.objectStore('media').delete(key);
      } catch (e) {}
    },
    async all() {
      try {
        const db = await open();
        return new Promise(res => {
          const tx = db.transaction('media', 'readonly');
          const store = tx.objectStore('media');
          const out = {};
          const cur = store.openCursor();
          cur.onsuccess = e => {
            const c = e.target.result;
            if (c) { out[c.key] = c.value; c.continue(); }
            else res(out);
          };
          cur.onerror = () => res({});
        });
      } catch (e) { return {}; }
    },
    async clear() {
      try {
        const db = await open();
        const tx = db.transaction('media', 'readwrite');
        tx.objectStore('media').clear();
      } catch (e) {}
    }
  };
})();

let MEDIA_CACHE = {};

const def = () => ({
  p: {
    name: 'Sung',
    title: 'The Awakened',
    sex: 'm',
    fstage: 'std',
    age: 28,
    h: 172,
    w: 82,
    tw: 72,
    act: 1.375,
    tier: 'bal',
    eq: 'body',
    diet: 'Indian High-Protein Veg',
    days: 30
  },
  w0: 82,
  xp: 0,
  done: {},
  prog: {},
  shuf: {},
  setLogs: {}, // { "day_exIdx": [ { reps: 10, kg: 15, done: true }, ... ] }
  prs: {},     // { "Exercise Name": { maxKg: 20, maxVol: 600, bestStr: "20 kg × 10" } }
  log: {},
  water: {},   // { "YYYY-MM-DD": 2.5 } (litres logged)
  combos: [
    { n: 'Desi Protein Breakfast', items: [['Boiled egg', 2], ['Whole wheat roti', 2], ['Curd / dahi (1 cup)', 1]] },
    { n: 'Soya & Dal Power Lunch', items: [['Soya chunks (30 g)', 1.5], ['Moong dal (1 cup)', 1], ['Whole wheat roti', 2]] }
  ],
  grocDone: {},
  sanct: {},
  stats: { STR: 10, AGI: 10, INT: 10, VIT: 10, SEN: 10 },
  streak: 1,
  freeze: 1,
  last: '',
  start: today(),
  wt: [],
  meas: [],
  mute: 0,
  custom: [],
  cal: {},
  boss: { wk: '', dmg: 12400, max: 20000, claimed: false },
  extraQuests: [],
  duels: [
    { id: 'd1', opp: 'IronBhai@guild.in', myStartXp: 0, oppStartXp: 0, oppGain: 210, ends: 'In 5 days', active: true }
  ],
  acct: { email: '', signedIn: false, isAdmin: false, orgCode: '' },
  b2b: {
    orgs: [
      { id: 'org1', name: 'Iron Temple Gym Indore', type: 'Gym', email: 'owner@irontemple.in', status: 'approved', code: 'GYM-IRON88', members: 142, challenge: '30-Day Monsoon Shred' },
      { id: 'org2', name: 'Apex Tech Solutions', type: 'Company', email: 'hr@apextech.io', status: 'pending', code: 'CORP-APEX26', members: 85, challenge: '10k Steps Desk Battle' }
    ],
    globalEvent: { title: 'Winter Arc — Global S-Rank Awakening', desc: 'Complete 3+ daily quests for 21 straight days to earn the Frost Monarch Title!', active: true },
    users: [
      { email: 'ShadowMonarch_K@guild.in', name: 'ShadowMonarch_K', lv: 34, disabled: false },
      { email: 'IronBhai@guild.in', name: 'IronBhai', lv: 22, disabled: false },
      { email: 'PriyaFit@guild.in', name: 'PriyaFit', lv: 13, disabled: false }
    ]
  },
  priv: { on: 1, name: 1, rank: 1, stats: 1, prog: 1, bio: 0 }
});

let S;
try {
  const parsed = JSON.parse(localStorage.getItem(K) || '{}');
  S = Object.assign(def(), parsed);
  S.p = Object.assign(def().p, parsed.p || {});
  S.acct = Object.assign(def().acct, parsed.acct || {});
  S.b2b = Object.assign(def().b2b, parsed.b2b || {});
  S.priv = Object.assign(def().priv, parsed.priv || {});
} catch (e) {
  S = def();
}

const save = () => {
  try {
    localStorage.setItem(K, JSON.stringify(S));
  } catch (e) {
    if (!window.sw) {
      window.sw = 1;
      toast('LocalStorage full. Photos are safely stored in IndexedDB.', 1);
    }
  }
};

(async function hydrateMedia() {
  const stored = await IDB.all();
  MEDIA_CACHE = stored || {};
  R();
})();

// Parse 1-click Coach Plan Link (#plan=...)
(function checkCoachHash() {
  try {
    if (location.hash && location.hash.startsWith('#plan=')) {
      const raw = decodeURIComponent(location.hash.slice(6));
      const cfg = JSON.parse(atob(raw));
      if (cfg && cfg.w && cfg.h) {
        Object.assign(S.p, cfg);
        S.w0 = +cfg.w;
        S.start = today();
        S.ob = 1;
        save();
        history.replaceState(null, '', location.pathname + location.search);
        setTimeout(() => toast('Coach Blueprint calibrated for ' + S.p.name + '!'), 350);
      }
    }
  } catch (e) {}
})();

let tab = 0, pen = 0, freezeUsed = 0, streakLockedToday = false, ac;

(function checkDailyReset() {
  const t = today();
  if (S.last && S.last !== t) {
    const n = Object.keys(S.done[S.last] || {}).length;
    if (n < 3 && !S.cal[S.last]) {
      if ((S.freeze || 0) > 0) {
        S.freeze -= 1;
        freezeUsed = 1;
      } else {
        S.streak = 0;
        pen = 1;
      }
    } else {
      S.streak++;
    }
  }
  S.last = t;
  const d = new Date();
  const wkKey = d.getFullYear() + '-W' + Math.ceil((((d - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1) / 7);
  if (!S.boss || S.boss.wk !== wkKey) {
    S.boss = { wk: wkKey, dmg: 11800, max: 20000, claimed: false };
  }
  save();
})();

/* ============================================================================
   2. AUDIO, TOAST WITH UNDO, LEVELING & BOSS DAMAGE
============================================================================ */
function snd(f, d = .12) {
  try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  if (S.mute) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.value = f;
    g.gain.value = .045;
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + d);
  } catch (e) {}
}

function toast(text, isErr = 0, undoFn = null) {
  const el = document.createElement('div');
  el.className = 'tt' + (isErr ? ' r' : '');
  const span = document.createElement('span');
  span.textContent = text;
  el.appendChild(span);
  if (undoFn) {
    const btn = document.createElement('button');
    btn.textContent = 'Undo';
    btn.style.cssText = 'padding:4px 9px;min-height:28px;font-size:11px;border-color:var(--cy)';
    btn.onclick = () => { undoFn(); el.remove(); };
    el.appendChild(btn);
  }
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), undoFn ? 5000 : 3000);
}

const lv = () => {
  let x = S.xp, l = 1;
  while (x >= l * 100) { x -= l * 100; l++; }
  return { l, x, n: l * 100 };
};
const rank = l => l < 5 ? 'E' : l < 10 ? 'D' : l < 15 ? 'C' : l < 25 ? 'B' : l < 40 ? 'A' : 'S';
const PV = () => S.priv = Object.assign({ on: 1, name: 1, rank: 1, stats: 1, prog: 1, bio: 0 }, S.priv || {});
const pubName = () => PV().name ? S.p.name : 'Anonymous Shadow';
const gp = () => {
  if (isMaternal()) return Math.min(100, Math.round((dayNo() / Math.max(1, S.p.days)) * 100));
  return Math.round(Math.max(0, Math.min(100, (S.w0 - S.p.w) / Math.max(.1, S.w0 - S.p.tw) * 100)));
};

function addXp(n) {
  const a = lv().l;
  S.xp += n;
  if (S.boss && !S.boss.claimed) {
    S.boss.dmg = Math.min(S.boss.max, (S.boss.dmg || 0) + n * 18);
    if (S.boss.dmg >= S.boss.max && !S.boss.claimed) {
      S.boss.claimed = true;
      S.p.title = 'Titan Slayer';
      toast('BOSS DEFEATED! New Title Unlocked: Titan Slayer (+150 XP)');
      S.xp += 150;
    }
  }
  const b = lv().l;
  if (b > a) {
    toast('LEVEL UP — Level ' + b + '. ARISE.');
    [520, 660, 880].forEach((f, i) => setTimeout(() => snd(f, .18), i * 120));
  }
}

/* ============================================================================
   3. CLEAN GENDER-AWARE ROUTING & CLINICAL METABOLIC ENGINE
============================================================================ */
const FEMALE_STAGES = [
  ['std', 'Standard Wellness'],
  ['pcos', 'Cycle & PCOS Support'],
  ['preg1', 'Pregnancy — Trimester 1'],
  ['preg2', 'Pregnancy — Trimester 2'],
  ['preg3', 'Pregnancy — Trimester 3'],
  ['post', 'Postpartum / Lactating']
];

const isFemale = () => S.p.sex === 'f';
const activeFStage = () => isFemale() ? (S.p.fstage || 'std') : 'std';
const isMaternal = () => isFemale() && ['preg1', 'preg2', 'preg3', 'post'].includes(activeFStage());
const fStageLabel = () => (FEMALE_STAGES.find(x => x[0] === activeFStage()) || FEMALE_STAGES[0])[1];

function setFemaleStage(val) {
  S.p.fstage = val;
  save();
  snd(640);
  toast('Women\'s Wellness mode updated: ' + fStageLabel());
  verifyAntiCheatQuests(true);
  R();
}

function vFemaleCard() {
  if (!isFemale()) return '';
  const st = activeFStage();
  const mat = isMaternal();
  return `<div class="c fm"><div class="row"><b>🌸 Women's Wellness</b><span class="tag f">${esc(fStageLabel())}</span></div><div class="mu" style="margin:4px 0 8px">${mat ? 'Maternal Safety Shield active: deficit disabled, gestational/lactation nourishment enabled, and unsafe exercises replaced with pelvic-safe movements.' : st === 'pcos' ? 'Cycle & PCOS mode: gentle 15% deficit with low-glycemic & high-fiber focus.' : 'Optional life-stage tailoring for cycle, PCOS, pregnancy, or postpartum.'}</div><select onchange="setFemaleStage(this.value)" aria-label="Women's Wellness Stage">${FEMALE_STAGES.map(x => `<option value="${x[0]}" ${st === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div>`;
}

function calc() {
  const p = S.p, w = +p.w, isMale = p.sex === 'm', fst = activeFStage();
  const bmr = 10 * w + 6.25 * p.h - 5 * p.age + (isMale ? 5 : -161);
  const tdee = bmr * p.act;

  let targetKcal, proteinMult = 1.8, modeNote = '';
  if (fst === 'preg1') {
    targetKcal = Math.max(1650, tdee);
    proteinMult = 1.5;
    modeNote = 'Trimester 1 Gestational Nourishment (+0 kcal deficit; folate & iron focus)';
  } else if (fst === 'preg2') {
    targetKcal = Math.max(1850, tdee + 340);
    proteinMult = 1.6;
    modeNote = 'Trimester 2 Maternal Energy (+340 kcal/day for baby\'s growth)';
  } else if (fst === 'preg3') {
    targetKcal = Math.max(1950, tdee + 450);
    proteinMult = 1.65;
    modeNote = 'Trimester 3 Maternal Energy (+450 kcal/day; calcium & iron priority)';
  } else if (fst === 'post') {
    targetKcal = Math.max(1800, tdee + 300);
    proteinMult = 1.75;
    modeNote = 'Postpartum & Lactation Support (+300 kcal/day; gentle pelvic recovery)';
  } else if (fst === 'pcos') {
    targetKcal = Math.max(tdee * 0.85, 1350);
    proteinMult = 1.9;
    modeNote = 'PCOS Low-Glycemic Recomposition (15% gentle deficit, high protein & fiber)';
  } else {
    targetKcal = Math.max(tdee * 0.8, isMale ? 1500 : 1200);
    proteinMult = 1.8;
    modeNote = 'Evidence-Based 20% Recomposition Deficit';
  }

  const pr = Math.round(w * proteinMult * (p.age >= 40 ? 1.1 : 1));
  const f = Math.round(w * 0.85);
  const c = Math.max(50, Math.round((targetKcal - pr * 4 - f * 9) / 4));
  const defKcal = Math.max(150, Math.abs(tdee - targetKcal));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), t: Math.round(targetKcal), pr, f, c, bmi: w / Math.pow(p.h / 100, 2), def: defKcal, modeNote };
}

function pdn(t) {
  let n = 0, d = new Date(S.start);
  const e = new Date(t);
  while (d <= e) {
    if (!S.cal[d.toISOString().slice(0, 10)]) n++;
    d.setDate(d.getDate() + 1);
  }
  return n;
}

// Dynamic Recommended Weight & Reps Engine based on user BW, sex, mobility tier & previous PRs
function getRecommendedTarget(exName, baseSets, baseReps, baseKg, bwRatio = 0) {
  const bw = +S.p.w || 70;
  const sexMult = S.p.sex === 'f' ? 0.72 : 1.0;
  const tierMult = S.p.tier === 'joint' ? 0.75 : S.p.tier === 'hiit' ? 1.15 : 1.0;
  const pr = (S.prs || {})[exName];
  const isWeighted = baseKg > 0 || bwRatio > 0 || (pr && pr.maxKg > 0);

  let recKg = 0;
  let recReps = baseReps;

  if (isWeighted) {
    const rawCalc = bwRatio > 0 ? bw * bwRatio * sexMult * tierMult : baseKg * sexMult * tierMult;
    const roundedCalc = Math.max(2.5, Math.round(rawCalc / 2.5) * 2.5);
    if (pr && pr.maxKg > 0) {
      // Auto-progress by +2.5 kg if user already hit target reps at their previous max weight
      recKg = (pr.repsAtMax || 0) >= baseReps ? +(pr.maxKg + 2.5).toFixed(1) : pr.maxKg;
    } else {
      recKg = roundedCalc;
    }
  } else {
    if (pr && (pr.maxReps || 0) >= baseReps) {
      recReps = pr.maxReps + 2;
    }
  }

  return {
    sets: baseSets,
    reps: recReps,
    kg: recKg,
    isWeighted,
    label: isWeighted ? `${recKg} kg × ${recReps} reps` : `Bodyweight × ${recReps}`
  };
}

function getRawExercises(d) {
  if (d % 4 === 0) {
    return isMaternal()
      ? [['Gentle evening walk (min)', 1, 15, 0, 0], ['Cat-Cow & hip mobility (min)', 1, 8, 0, 0], ['Pelvic floor & deep breathing (min)', 1, 5, 0, 0]]
      : [['Active recovery: easy walk (min)', 1, 20, 0, 0], ['Full-body mobility stretch (min)', 1, 10, 0, 0], ['Box breathing (min)', 1, 5, 0, 0]];
  }
  const key = isMaternal() ? 'maternal' : ((S.p.eq && S.p.eq !== 'body') ? S.p.eq : (S.p.tier || 'bal'));
  const sh = (S.shuf && S.shuf[d]) || 0;
  const source = ((d + sh) % 2 === 0 ? ALT_POOLS[key] : EX_POOLS[key]) || EX_POOLS.bal;
  const progReps = Math.floor(d / 7) * 2;
  return source.map(([name, sets, reps, kg, ratio]) => [
    name,
    sets,
    reps + (name.includes('(min)') ? 0 : progReps),
    kg,
    ratio || 0
  ]);
}

function getExerciseSets(d, idx, defaultSets, defaultReps, defaultKg, bwRatio = 0) {
  S.setLogs = S.setLogs || {};
  const k = `${d}_${idx}`;
  if (!S.setLogs[k] || !Array.isArray(S.setLogs[k])) {
    const exName = getRawExercises(d)[idx]?.[0] || '';
    const rec = getRecommendedTarget(exName, defaultSets, defaultReps, defaultKg, bwRatio);
    S.setLogs[k] = Array.from({ length: defaultSets }, () => ({
      reps: rec.reps,
      kg: rec.kg,
      done: false
    }));
  }
  return S.setLogs[k];
}

function applyRecommendedToSets(d, idx) {
  const ex = getRawExercises(d)[idx];
  if (!ex) return;
  const rec = getRecommendedTarget(ex[0], ex[1], ex[2], ex[3], ex[4]);
  const sets = getExerciseSets(d, idx, ex[1], ex[2], ex[3], ex[4]);
  sets.forEach(s => {
    if (!s.done) {
      s.kg = rec.kg;
      s.reps = rec.reps;
    }
  });
  save();
  snd(600, .08);
  toast(`Applied Recommended Target (${rec.label})!`);
  R();
}

function stepSetField(d, idx, setIdx, field, delta) {
  const ex = getRawExercises(d)[idx];
  const sets = getExerciseSets(d, idx, ex[1], ex[2], ex[3], ex[4]);
  if (!sets[setIdx]) return;
  const next = Math.max(0, +((sets[setIdx][field] || 0) + delta).toFixed(1));
  sets[setIdx][field] = next;
  save();
  snd(520, .05);
  R();
}

function updateSetField(d, idx, setIdx, field, val) {
  const ex = getRawExercises(d)[idx];
  const sets = getExerciseSets(d, idx, ex[1], ex[2], ex[3], ex[4]);
  if (!sets[setIdx]) return;
  sets[setIdx][field] = Math.max(0, parseFloat(val) || 0);
  save();
}

function addSetRow(d, idx) {
  const ex = getRawExercises(d)[idx];
  const sets = getExerciseSets(d, idx, ex[1], ex[2], ex[3], ex[4]);
  const last = sets[sets.length - 1] || { reps: ex[2], kg: ex[3] };
  sets.push({ reps: last.reps, kg: last.kg, done: false });
  save();
  R();
  if ($('#m .mc')) qd('w');
}

function removeSetRow(d, idx) {
  const ex = getRawExercises(d)[idx];
  const sets = getExerciseSets(d, idx, ex[1], ex[2], ex[3], ex[4]);
  if (sets.length <= 1) return;
  sets.pop();
  save();
  checkExerciseAndDayCompletion(d, idx);
  R();
  if ($('#m .mc')) qd('w');
}

function toggleSetDone(d, idx, setIdx) {
  const ex = getRawExercises(d)[idx];
  const sets = getExerciseSets(d, idx, ex[1], ex[2], ex[3], ex[4]);
  const s = sets[setIdx];
  if (!s) return;
  s.done = !s.done;

  if (s.done) {
    snd(680, .09);
    startRestTimer(60);
    // Check Personal Record (PR) on weight, reps at max weight, or volume
    const exName = ex[0];
    S.prs = S.prs || {};
    const prev = S.prs[exName] || { maxKg: 0, repsAtMax: 0, maxVol: 0, maxReps: 0, bestStr: '' };
    const vol = (s.kg || 0) * (s.reps || 0);
    let newPr = false;
    if (s.kg > 0 && s.kg > prev.maxKg) {
      prev.maxKg = s.kg;
      prev.repsAtMax = s.reps;
      prev.bestStr = `${s.kg} kg × ${s.reps}`;
      newPr = true;
    } else if (s.kg > 0 && s.kg === prev.maxKg && s.reps > (prev.repsAtMax || 0)) {
      prev.repsAtMax = s.reps;
      prev.bestStr = `${s.kg} kg × ${s.reps}`;
      newPr = true;
    } else if (vol > 0 && vol > prev.maxVol) {
      prev.maxVol = vol;
      prev.bestStr = `${s.kg} kg × ${s.reps}`;
      newPr = true;
    } else if (s.kg === 0 && s.reps > (prev.maxReps || 0)) {
      prev.maxReps = s.reps;
      prev.bestStr = `${s.reps} reps`;
      if (prev.maxReps > ex[2]) newPr = true;
    }
    S.prs[exName] = prev;
    if (newPr) {
      addXp(15);
      S.stats.STR++;
      toast(`🏆 NEW PR on ${exName}: ${prev.bestStr}! (+15 XP, +1 STR)`);
    }
  }

  checkExerciseAndDayCompletion(d, idx);
  save();
  R();
  if ($('#m .mc')) qd('w');
}

function checkExerciseAndDayCompletion(d, idx) {
  const exList = getRawExercises(d);
  const p = S.prog[d] = S.prog[d] || {};
  exList.forEach((ex, i) => {
    const sets = getExerciseSets(d, i, ex[1], ex[2], ex[3], ex[4]);
    if (sets.length > 0 && sets.every(s => s.done)) p[i] = 1;
    else delete p[i];
  });

  const doneCount = exList.filter((_, i) => p[i]).length;
  if (doneCount === exList.length && !p.x) {
    p.x = 1;
    addXp(25);
    S.stats.STR++;
    toast('Day ' + d + ' Workout Cleared! +25 XP');
    snd(780);
  }
  if (d === dayNo()) {
    verifyAntiCheatQuests(true);
  }
}

  REST_END = Date.now() + sec * 1000;
  if (REST_INT) clearInterval(REST_INT);

    const rem = Math.ceil((REST_END - Date.now()) / 1000);
    const el = $('#rest_cd');

      clearInterval(REST_INT);
      REST_INT = null;
      REST_END = 0;
      snd(880, .2);
      toast('⏱️ Rest complete! Start your next set.');
      R();
    } else if (el) {
      el.textContent = rem + 's';
    }

}

  if (REST_INT) clearInterval(REST_INT);
  REST_INT = null;
  REST_END = 0;

// Strict Anti-Cheat Verifier: automatically awards or revokes XP based on real logged numbers
function verifyAntiCheatQuests(silent = false) {
  const d = today();
  S.done[d] = S.done[d] || {};
  const c = calc();
  const T = tot();
  const wLitres = +((S.water || {})[d] || 0);
  const watch = S.watch || {};
  const stepGoal = isMaternal() ? 6000 : 8000;
  const dayProg = S.prog[dayNo()] || {};
  const workoutDone = !!dayProg.x;

  const checks = {
    w: workoutDone,
    p: T.p >= c.pr * 0.95,
    c: isMaternal() ? (T.k >= c.t * 0.85 && T.k <= c.t * 1.2) : (T.k >= 800 && T.k <= c.t * 1.05),
    h: wLitres >= 3.0,
    s: (watch.steps || 0) >= stepGoal,
    z: (watch.sleep || 0) >= 7
  };

  let changed = false;
  for (const [qid, met] of Object.entries(checks)) {
    const q = Q().find(x => x.id === qid);
    if (!q || !q.auto) continue;
    const wasDone = !!S.done[d][qid];
    if (met && !wasDone) {
      S.done[d][qid] = 1;
      addXp(q.xp);
      S.stats[q.st] = (S.stats[q.st] || 10) + 1;
      changed = true;
      if (!silent) {
        snd(700);
        toast(`✅ Verified & Auto-Completed: ${q.t} (+${q.xp} XP)`);
      }
    } else if (!met && wasDone) {
      delete S.done[d][qid];
      S.xp = Math.max(0, S.xp - q.xp);
      S.stats[q.st] = Math.max(1, (S.stats[q.st] || 10) - 1);
      changed = true;
    }
  }
  if (changed) save();
}

function parseMultiMeal(raw) {
  const parts = raw.split(/\+|,|and/i).map(s => s.trim()).filter(Boolean);
  let logged = 0;
  for (const part of parts) {
    const m = part.match(/^(\d+(?:\.\d+)?)\s*(?:x|×)?\s*(.+)$/i);
    const qty = m ? parseFloat(m[1]) : 1;
    const term = (m ? m[2] : part).toLowerCase();
    const hit = F.find(f => f[0].toLowerCase().includes(term) || term.split(' ').some(w => w.length > 2 && f[0].toLowerCase().includes(w)));
    if (hit) {
      logF(hit[0], hit[1], hit[2], hit[3], hit[4], qty);
      logged++;
    }
  }
  if (logged > 0) {
    toast(`Logged ${logged} item${logged > 1 ? 's' : ''} in 1 tap!`);
    const inp = $('#fs');
    if (inp) inp.value = '';
    R();
  } else {
    toast('No matching food found. Try e.g. "2 roti + 1 dal + 1 curd"', 1);
  }
}

function calcBodyFat() {
  const m = (S.meas || [])[S.meas.length - 1];
  if (!m || !m.waist || !m.neck) return null;
  const h = +S.p.h, w = +S.p.w, isMale = S.p.sex === 'm';
  let bf;
  if (isMale) {
    if (m.waist <= m.neck) return null;
    bf = 495 / (1.0324 - 0.19077 * Math.log10(m.waist - m.neck) + 0.15456 * Math.log10(h)) - 450;
  } else {
    const hip = m.hip || m.waist + 14;
    if ((m.waist + hip) <= m.neck) return null;
    bf = 495 / (1.29579 - 0.35004 * Math.log10(m.waist + hip - m.neck) + 0.22100 * Math.log10(h)) - 450;
  }
  bf = Math.max(4, Math.min(60, bf));
  const leanKg = w * (1 - bf / 100);
  return { bf: bf.toFixed(1), lean: leanKg.toFixed(1), waist: m.waist };
}

function pic(cam, cb) {
  const i = document.createElement('input');
  i.type = 'file';
  i.accept = 'image/*';
  if (cam) i.capture = 'environment';
  i.onchange = () => {
    const f = i.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 640 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = im.width * k;
        c.height = im.height * k;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.68));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  i.click();
}

  if (!navigator.geolocation) { toast('Location unavailable.', 1); return; }

  const name = ($('#org_name').value || '').trim();
  const type = $('#org_type').value;
  const email = ($('#org_em').value || '').trim();
  const challenge = ($('#org_chal').value || '30-Day Fitness Sprint').trim();
  if (!name || !email.includes('@')) { toast('Enter organization name and valid email.', 1); return; }
  const code = (type === 'Gym' ? 'GYM-' : 'CORP-') + Math.random().toString(36).slice(2, 7).toUpperCase();
  S.b2b.orgs.unshift({ id: 'org_' + Date.now(), name, type, email, status: 'pending', code, members: 1, challenge });
  save(); closeM(); snd(680);
  toast(`Request submitted for ${name}! Status: Pending Owner Approval.`);
  R();
}

function openAdminConsole() {
  if (!S.acct?.isAdmin) { toast('Super-Admin access required.', 1); return; }
  const orgs = S.b2b.orgs || [];
  const users = S.b2b.users || [];
  const ev = S.b2b.globalEvent || { title: '', desc: '', active: false };

  modal(`<div class="row"><h3 class="o" style="margin:0;color:var(--am)">👑 Super-Admin Command Console</h3><button onclick="closeM()">Close</button></div>
    <div class="c ad" style="margin:10px 0">
      <b>🌍 Global Challenge &amp; Event Broadcast</b>

      <input id="ev_desc" value="${esc(ev.desc)}" placeholder="Event Description" style="margin-bottom:6px">
      <div class="row"><label style="color:var(--tx)"><input id="ev_act" type="checkbox" style="width:auto" ${ev.active ? 'checked' : ''}> Active Worldwide Banner</label><button class="a" onclick="saveGlobalEvent()">Broadcast Event</button></div>
    </div>
    <div class="c" style="margin:10px 0">
      <b>🏢 Gym &amp; Company Access Approvals (${orgs.length})</b>

        <div class="row"><b>${esc(o.name)} <span class="tag c">${esc(o.type)}</span></b><span class="tag ${o.status === 'approved' ? '' : 'a'}">${o.status.toUpperCase()}</span></div>
        <div class="mu">${esc(o.email)} · Join Code: <b>${esc(o.code)}</b> · Challenge: ${esc(o.challenge)}</div>
        <div class="row" style="margin-top:6px;justify-content:flex-start">
          ${o.status !== 'approved' ? `<button class="e" style="min-height:30px;padding:3px 9px" onclick="setOrgStatus(${idx},'approved')">Approve &amp; Issue Code</button>` : ''}
          ${o.status !== 'rejected' ? `<button class="x" style="min-height:30px;padding:3px 9px" onclick="setOrgStatus(${idx},'rejected')">Reject / Suspend</button>` : ''}

        <button class="${u.disabled ? 'e' : 'x'}" style="min-height:30px;padding:3px 8px" onclick="toggleUserDisable(${idx})">${u.disabled ? 'Enable' : 'Disable'}</button>

}
function saveGlobalEvent() {
  S.b2b.globalEvent = { title: $('#ev_title').value.trim(), desc: $('#ev_desc').value.trim(), active: $('#ev_act').checked };
  save(); snd(800); toast('Global event updated!'); R(); openAdminConsole();
}
function setOrgStatus(idx, status) {
  S.b2b.orgs[idx].status = status;
  save(); snd(720); toast(`${S.b2b.orgs[idx].name} marked ${status.toUpperCase()}`); R(); openAdminConsole();
}
function toggleUserDisable(idx) {
  S.b2b.users[idx].disabled = !S.b2b.users[idx].disabled;
  save(); toast('User status updated.'); openAdminConsole();
}

function buyFreeze() {
  if (S.xp < 200) { toast('Need at least 200 XP to purchase a Streak Freeze.', 1); return; }
  S.xp -= 200; S.freeze = (S.freeze || 0) + 1; save(); snd(820); toast('Streak Freeze Token acquired! (❄️ ' + S.freeze + ')'); R();
}

function prof() {
  const p = S.p;
  const f = (l, i, v, t = 'number') => `<div><label>${l}</label><input id="${i}" type="${t}" step="any" value="${esc(v)}"></div>`;
  const o = (a, v) => a.map(x => `<option value="${x[0]}" ${x[0] == v ? 'selected' : ''}>${x[1]}</option>`).join('');
  modal(`<h3 class="o">Hunter Profile</h3><div class="grid">${f('Name', 'pn', p.name, 'text')}${f('Title', 'pt', p.title, 'text')}<div><label>Sex</label><select id="ps">${o([['m', 'Male'], ['f', 'Female']], p.sex)}</select></div>${f('Age', 'pa', p.age)}${f('Height (cm)', 'ph', p.h)}${f('Weight (kg)', 'pw', p.w)}${f('Target (kg)', 'ptw', p.tw)}<div><label>Activity</label><select id="pc">${o([[1.2, 'Mostly sitting'], [1.375, 'Light walking'], [1.55, 'Active'], [1.725, 'Very active']], p.act)}</select></div><div><label>Workout style</label><select id="pm">${o([['joint', 'Gentle / Joint-Safe'], ['bal', 'Balanced'], ['hiit', 'High-Intensity']], p.tier)}</select></div><div><label>Equipment</label><select id="pq">${o([['body', 'Bodyweight'], ['dumb', 'Dumbbells / Bands'], ['gym', 'Full gym'], ['desi', 'Desi style']], p.eq || 'body')}</select></div><div><label>Diet</label><select id="pd">${o(['Indian High-Protein Veg', 'Eggetarian', 'Omnivore', 'Plant-Based'].map(x => [x, x]), p.diet)}</select></div>${f('Commitment (days)', 'pdays', p.days)}</div><div class="row" style="margin-top:12px"><button class="p" onclick="ps()">Save</button><button onclick="closeM()">Cancel</button></div>`);
}
function ps() {
  const g = i => $('#' + i).value;
  Object.assign(S.p, { name: g('pn') || 'Hunter', title: g('pt'), sex: g('ps'), age: +g('pa'), h: +g('ph'), w: +g('pw'), tw: +g('ptw'), act: +g('pc'), tier: g('pm'), eq: g('pq'), diet: g('pd'), days: Math.max(1, Math.round(+g('pdays') || 30)) });
  if (S.p.sex === 'm') S.p.fstage = 'std';
  verifyAntiCheatQuests(true);
  save(); closeM(); toast('Profile updated & recalculated!'); R();
}

// Streamlined 6-Step High-Conversion Onboarding
let OS = 0, OA = { name: '', sex: 'm', age: 28, h: 170, w: 75, tw: 68, act: 1.375, diet: 'Indian High-Protein Veg', days: 30 };

function ob() {
  const m = $('#m');
  if (OS >= 6) {
    const sv = S.p;
    S.p = Object.assign({}, sv, OA, { fstage: 'std', tier: 'bal', eq: 'body' });
    const c = calc();
    S.p = sv;
    const endDt = new Date();
    endDt.setDate(endDt.getDate() + OA.days);
    const diffKg = Math.max(0, +(OA.w - OA.tw).toFixed(1));
    const wkPace = Math.min(0.8, Math.max(0.3, +(c.def * 7 / 7700).toFixed(2)));
    m.innerHTML = `<div class="mb"><div class="mc">
      <div class="row"><span class="tag">+50 WELCOME XP READY</span><span class="mu">Plan Calibrated</span></div>
      <div class="o" style="font-size:19px;margin:8px 0">Your Blueprint is Ready, ${esc(OA.name)}!</div>
      <div class="c s" style="margin:8px 0">
        <div class="grid">
          <div><div class="mu">Daily Calories</div><b class="o" style="font-size:16px;color:var(--cy)">${c.t} kcal</b></div>
          <div><div class="mu">Daily Protein</div><b class="o" style="font-size:16px;color:var(--em)">${c.pr} g</b></div>
          <div><div class="mu">Target Date</div><b>${endDt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}</b></div>
          <div><div class="mu">Safe Pace</div><b>${diffKg > 0 ? `~${wkPace} kg/wk` : 'Recomp & Tone'}</b></div>
        </div>
      </div>
      <div class="mu" style="margin-bottom:10px">${OA.sex === 'f' ? 'Tip: Enable Cycle, PCOS, or Pregnancy support anytime under Women\'s Wellness in Profile or Body.' : 'Customize gym equipment, sets/reps, or privacy settings anytime.'}</div>
      <button class="p" style="width:100%;padding:12px;font-size:14px" onclick="obf()">Claim +50 XP &amp; Start Day 1</button>
    </div></div>`;
    return;
  }

  let body = '';
  if (OS === 0) {
    body = `<div class="o" style="font-size:17px;margin:12px 0">What should THE SYSTEM call you?</div>
      <input id="oi_name" type="text" value="${esc(OA.name)}" placeholder="Enter your name or Hunter alias" onkeydown="if(event.key==='Enter')obNext()">`;
  } else if (OS === 1) {
    body = `<div class="o" style="font-size:17px;margin:12px 0">Select your biological profile</div>
      <button style="display:block;width:100%;margin:8px 0;padding:14px;${OA.sex === 'm' ? 'background:var(--cy);color:#001018' : ''}" onclick="OA.sex='m';OS++;ob()">Male</button>
      <button style="display:block;width:100%;margin:8px 0;padding:14px;${OA.sex === 'f' ? 'background:var(--cy);color:#001018' : ''}" onclick="OA.sex='f';OS++;ob()">Female</button>`;
  } else if (OS === 2) {
    const ft = Math.floor(OA.h / 30.48), inch = Math.round(OA.h / 2.54 % 12);
    body = `<div class="o" style="font-size:17px;margin:12px 0">Your age &amp; height</div>
      <div class="grid">
        <div><label>Age (years)</label><input id="oi_age" type="number" min="14" max="90" value="${OA.age}"></div>
        <div><label>Height (cm)</label><input id="oi_h" type="number" min="120" max="220" value="${OA.h}" oninput="$('#h_prev').textContent='≈ '+Math.floor(this.value/30.48)+' ft '+Math.round(this.value/2.54%12)+' in'"></div>
      </div>
      <div id="h_prev" class="mu" style="margin-top:6px">≈ ${ft} ft ${inch} in</div>`;
  } else if (OS === 3) {
    body = `<div class="o" style="font-size:17px;margin:12px 0">Current &amp; target weight</div>
      <div class="grid">
        <div><label>Current weight (kg)</label><input id="oi_w" type="number" step=".1" min="30" max="250" value="${OA.w}"></div>
        <div><label>Target weight (kg)</label><input id="oi_tw" type="number" step=".1" min="30" max="250" value="${OA.tw}"></div>
      </div>`;
  } else if (OS === 4) {
    body = `<div class="o" style="font-size:17px;margin:12px 0">Daily activity &amp; diet</div>
      <label>Normal daily activity</label>
      <select id="oi_act" style="margin-bottom:10px">
        <option value="1.2" ${OA.act == 1.2 ? 'selected' : ''}>Mostly sitting (desk / home)</option>
        <option value="1.375" ${OA.act == 1.375 ? 'selected' : ''}>Light walking &amp; errands</option>
        <option value="1.55" ${OA.act == 1.55 ? 'selected' : ''}>Active / on feet often</option>
        <option value="1.725" ${OA.act == 1.725 ? 'selected' : ''}>Very active / physical job</option>
      </select>
      <label>Preferred diet</label>
      <select id="oi_diet">
        ${['Indian High-Protein Veg', 'Eggetarian', 'Omnivore', 'Plant-Based'].map(x => `<option value="${x}" ${OA.diet === x ? 'selected' : ''}>${x}</option>`).join('')}
      </select>`;
  } else if (OS === 5) {
    body = `<div class="o" style="font-size:17px;margin:12px 0">Choose your commitment timeline</div>
      ${[[14, '14 Days — Quick Momentum'], [30, '30 Days — Habit & Fat-Loss Ignition'], [60, '60 Days — Visible Transformation'], [90, '90 Days — Full Body Recomposition']].map(([d, lbl]) => `<button style="display:block;width:100%;margin:6px 0;padding:12px;${OA.days === d ? 'background:var(--cy);color:#001018' : ''}" onclick="OA.days=${d};OS++;ob()">${lbl}</button>`).join('')}`;
  }

  m.innerHTML = `<div class="mb"><div class="mc">
    <div class="row"><span class="mu">Step ${OS + 1} of 6</span><span class="mu">~15 sec setup</span></div>
    ${B(OS + 1, 6)}
    ${body}
    <div class="row" style="margin-top:14px">
      <button ${OS ? '' : 'disabled'} onclick="OS--;ob()">Back</button>
      ${OS === 1 || OS === 5 ? '' : '<button class="p" onclick="obNext()">Continue</button>'}
    </div>
  </div></div>`;
  const inp = m.querySelector('input');
  if (inp) inp.focus();
}

function obNext() {
  if (OS === 0) {
    const v = ($('#oi_name').value || '').trim();
    if (!v) { toast('Please enter your name.', 1); return; }
    OA.name = v;
  } else if (OS === 2) {
    const age = +$('#oi_age').value, h = +$('#oi_h').value;
    if (age < 14 || age > 90 || h < 120 || h > 220) { toast('Enter valid age (14–90) and height (120–220 cm).', 1); return; }
    OA.age = age; OA.h = h;
  } else if (OS === 3) {
    const w = +$('#oi_w').value, tw = +$('#oi_tw').value;
    if (w < 30 || w > 250 || tw < 30 || tw > 250) { toast('Enter valid weights (30–250 kg).', 1); return; }
    OA.w = w; OA.tw = tw;
  } else if (OS === 4) {
    OA.act = +$('#oi_act').value; OA.diet = $('#oi_diet').value;
  }
  OS++; ob();
}

function obf() {
  Object.assign(S.p, OA, { fstage: 'std', tier: 'bal', eq: 'body' });
  S.w0 = OA.w; S.start = today(); S.ob = 1; S.xp = 50; S.done = {}; S.prog = {}; S.wt = [];
  save(); closeM(); snd(780); toast('Awakened! +50 Welcome XP credited.'); R();
}

const TR = [
  ['Quests', '🎯', 0, 'Water, steps, sleep, protein, calories & workouts auto-complete when real numbers are logged.'],
  ['Program', '🏋️', 1, 'Log exact Sets × Reps × kg per exercise, beat your PRs, or shuffle routines anytime.'],
  ['Body', '💪', 2, 'Type "2 roti + 1 dal + 1 curd" in 1 tap, get a 7-day grocery list, and clear Sanctuary gates.'],
  ['Feed', '📸', 3, 'Post progress, share stories, and chat with the Guild.'],
  ['Calendar', '📅', 4, 'Check in at your gym via GPS, Code, or Camera QR, or tap your Hunter Name at the top for Profile & Admin Console.']
];
function tour(i) {
  if (i >= TR.length) { S.ver = VER; save(); tab = 0; R(); closeM(); if (S.brief !== today()) brief(); return; }
  const t = TR[i];
  tab = t[2]; R();
  modal(`<div class="mu">Quick tour · ${i + 1} of ${TR.length}</div><div style="font-size:40px;margin:6px 0">${t[1]}</div><h3 class="o" style="margin:0 0 6px">${t[0]}</h3><div>${t[3]}</div>${B(i + 1, TR.length)}<div class="row" style="margin-top:12px"><button onclick="S.ver=VER;save();closeM()">Skip</button><span><button ${i ? '' : 'disabled'} onclick="tour(${i - 1})">Back</button> <button class="p" onclick="tour(${i + 1})">${i < TR.length - 1 ? 'Next' : 'Start'}</button></span></div>`);
}

/* ============================================================================
   10. ACTIONABLE AI COACH & 30-DAY PHOTO CHECK-IN
============================================================================ */
let CCH = [];
function pushCoachQuest(title, xp, st) {
  S.extraQuests = S.extraQuests || [];
  S.extraQuests.push({ id: 'cq_' + Date.now(), d: today(), t: title, xp, st, auto: false, r: 'Recommended by System AI Coach tailored to your current state.', l: 'Optional Coach bonus — zero penalty if skipped.' });
  save(); snd(720); toast('Added to Today\'s Quests: ' + title); R();
}
function getCoachAction(q) {
  const s = q.toLowerCase();
  if (/eat|food|dinner|lunch|hungry|snack|sweet|protein/.test(s)) {
    return {
      text: `You have ~${Math.max(0, calc().t - Math.round(tot().k))} kcal and ${Math.max(0, calc().pr - Math.round(tot().p))} g protein left today. Try Curd & Sprout Chaat (210 kcal, 17g P) or Soya Pulao!`,
      btnLabel: '+ Log Curd & Sprout Chaat (210 kcal)',
      onClick: `logF('Curd sprout chaat',210,17,26,5);closeM();`
    };
  }
  if (/10|minute|busy|tired|desk|quick/.test(s)) {
    return {
      text: isMaternal()
        ? 'Try a gentle 10-Minute Prenatal Mobility & Walk: 5 min easy walk + Cat-Cow + Pelvic Tilts.'
        : 'Do a 10-Minute Express Circuit: 2 sets × 15 squats, 2 sets × 10 push-ups, and a 30s plank.',
      btnLabel: '+ Add 10-Min Circuit to Today\'s Quests',
      onClick: `pushCoachQuest('Coach Bonus: 10-Min Express Circuit',25,'AGI');closeM();`
    };
  }
  return {
    text: `Hit ${calc().pr}g protein, log your sets in Program, and clear 3+ quests today to keep your ${S.streak}-day streak alive!`,
    btnLabel: '+ Add 5-Min Post-Meal Walk to Quests',
    onClick: `pushCoachQuest('Coach Habit: 5-Min Post-Meal Walk',15,'AGI');closeM();`
  };
}
function cmh() {
  return CCH.map(m => `<div style="margin:8px 0;text-align:${m.r === 'u' ? 'right' : 'left'}"><div class="${m.r === 'u' ? 'bu' : ''}" style="display:inline-block;max-width:90%;padding:9px 11px;border-radius:10px;${m.r === 'u' ? '' : 'background:var(--bg);border:1px solid #00e5ff40;'}text-align:left;white-space:pre-wrap">${esc(m.t)}${m.act ? `<div style="margin-top:8px"><button class="e" style="width:100%" onclick="${m.act.onClick}">${esc(m.act.btnLabel)}</button></div>` : ''}</div></div>`).join('') || '<div class="mu">Ask Coach anything — I know your live macros &amp; streak and can log meals or push workouts straight to your Quests!</div>';
}
function cup() { const e = $('#cm'); if (e) { e.innerHTML = cmh(); e.scrollTop = e.scrollHeight; } }
function coach() {
  modal(`<div class="row"><h3 class="o" style="margin:0">🤖 System AI Coach</h3><button onclick="closeM()">Close</button></div><div id="cm" style="max-height:46vh;overflow:auto;margin:8px 0">${cmh()}</div><div class="row" style="justify-content:flex-start">${['What should I eat tonight?', 'I have only 10 minutes', 'How do I stay consistent?'].map(q => `<button onclick="cask(this.dataset.q)" data-q="${q}" style="font-size:11px">${q}</button>`).join('')}</div><div class="row" style="margin-top:8px"><input id="cq" placeholder="Ask Coach..." style="flex:1" onkeydown="if(event.key==='Enter')cask()"><button class="p" onclick="cask()">Ask</button></div>`);
  cup();
}
function cask(q) {
  const i = $('#cq'); q = q || (i && i.value.trim()); if (!q) return; if (i) i.value = '';
  CCH.push({ r: 'u', t: q });
  const ans = getCoachAction(q);
  CCH.push({ r: 'a', t: ans.text, act: ans });
  snd(620); cup();
}

function phq(m) {
  const p = MEDIA_CACHE['photo_' + m];
  modal(`<h3 class="o">Day ${m} Transformation Photo</h3>${p ? `<img src="${p}" style="width:100%;border-radius:8px;max-height:280px;object-fit:cover">` : '<div class="mu">No photo yet.</div>'}<div class="row" style="margin:10px 0"><button class="p" onclick="pk(${m},1)">Take photo</button><button class="p" onclick="pk(${m},0)">From gallery</button>${p ? `<button class="x" onclick="pdel(${m})">Delete</button>` : ''}</div><div class="mu">Stored privately in IndexedDB. +25 XP on first check-in.</div>`);
}
function pk(m, cam) {
  pic(cam, async dataUrl => {
    await IDB.put('photo_' + m, dataUrl);
    MEDIA_CACHE['photo_' + m] = dataUrl;
    S.ph = S.ph || {};
    if (!S.ph[m]) { S.ph[m] = 1; addXp(25); if (Object.keys(S.ph).length === 5) toast('Badge Unlocked: Transformation Monarch!'); }
    save(); R(); phq(m);
  });
}
async function pdel(m) { await IDB.del('photo_' + m); delete MEDIA_CACHE['photo_' + m]; if (S.ph) delete S.ph[m]; save(); R(); closeM(); }

function bk() { const t = JSON.stringify(S); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Backup copied!')).catch(() => modal('<textarea style="height:160px">' + esc(t) + '</textarea><button onclick="closeM()">Close</button>')); }
function rs() { modal('<div class="mu">Paste backup JSON:</div><textarea id="rt" style="height:150px;margin:8px 0"></textarea><div class="row"><button class="p" onclick="rs2()">Restore</button><button onclick="closeM()">Cancel</button></div>'); }
function rs2() { try { S = Object.assign(def(), JSON.parse($('#rt').value)); save(); closeM(); R(); toast('Backup restored!'); } catch (e) { toast('Invalid backup data.', 1); } }
function delAll() { modal('<h3 class="o">Reset all data?</h3><p class="mu">Clears progress, IndexedDB photos, and settings.</p><div class="row"><button class="x" onclick="dl2()">Yes, reset</button><button onclick="closeM()">Cancel</button></div>'); }
async function dl2() { await IDB.clear(); MEDIA_CACHE = {}; S = def(); save(); OS = 0; closeM(); tab = 0; R(); ob(); }

function codex() {
  modal(`<h3 class="o">How THE SYSTEM Works</h3><p><b>Anti-Cheat Verification:</b> Water, steps, sleep, protein, calories, and workouts auto-complete strictly when real numbers are logged.</p><p><b>Progressive Overload &amp; PRs:</b> Log exact Sets × Reps × kg in Program. Beating your previous weight or volume record unlocks a PR badge and bonus STR XP.</p><p><b>Metabolic Engine:</b> Mifflin-St Jeor BMR × activity factor − 20% safe deficit (floor 1500 kcal M / 1200 kcal F), protein 1.8 g/kg (+10% for age 40+). Maternal mode disables deficits and enforces pelvic-safe exercises.</p><button onclick="closeM()">Close</button>`);
}

function modal(h) { $('#m').innerHTML = `<div class="mb" role="dialog" aria-modal="true" onclick="if(event.target===this)closeM()"><div class="mc">${h}</div></div>`; }
function closeM() { $('#m').innerHTML = ''; }

function R(keep) {
  const fs = document.activeElement && document.activeElement.id === 'fs';
  hud();
  nav();
  $('#main').innerHTML = [vQ, vP, () => vN() + '<h3 class="o">Sanctuary</h3>' + vS(), vFeed, vK, vPf][tab]();
  if (fs) {
    const e = $('#fs');
    if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); }
  }
}

R();
if (!S.ob) {
  ob();
} else {
  if (freezeUsed) toast('❄️ Streak Freeze Token used! Your ' + S.streak + '-day streak was saved.');
  else if (pen) toast('Streak reset: fewer than 3 quests completed yesterday.', 1);
  if (S.ver !== VER) { S.ver = VER; save(); }
  if (S.brief !== today()) brief();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ob && $('#m .mb')) closeM(); });
</script>
